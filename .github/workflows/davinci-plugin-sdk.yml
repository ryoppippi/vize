name: Davinci Plugin SDK

on:
  pull_request:
    branches: [main, davinci]
    paths:
      - "npm/plugin-sdk/**"
      - "crates/vize_vitrine/**"
      - "crates/vize_croquis/**"
      - "tests/tooling/davinci-plugin-*.test.ts"
      - "tests/tooling/fixtures/davinci-plugin-sdk/**"
      - ".github/workflows/davinci-plugin-sdk.yml"
  push:
    branches: [main, davinci]
    paths:
      - "npm/plugin-sdk/**"
      - "crates/vize_vitrine/**"
      - "crates/vize_croquis/**"
      - "tests/tooling/davinci-plugin-*.test.ts"
      - "tests/tooling/fixtures/davinci-plugin-sdk/**"
      - ".github/workflows/davinci-plugin-sdk.yml"
  workflow_dispatch:

concurrency:
  group: davinci-plugin-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plugin-contracts:
    name: Native JS plugin contracts (TS-51)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: davinci-plugin-sdk
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - run: vp install --frozen-lockfile --prefer-offline
      - name: Build the actual native JS host
        working-directory: npm/native
        run: vp run build:ci
      - name: Run the author package and native plugin contracts
        run: vp exec node --test tests/tooling/davinci-plugin-authoring.test.ts tests/tooling/davinci-plugin-sdk.test.ts tests/tooling/davinci-plugin-ga.test.ts
